name: Publicar no Instagram

on:
  push:
    branches: [main]
    paths: ["posts/fila/**", "scripts/publicar.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar git
        run: |
          git config user.name "congoapp-bot"
          git config user.email "congoapp-bot@users.noreply.github.com"

      - name: Narração ElevenLabs nos Reels (se houver)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: |
          if ls posts/fila/*.json >/dev/null 2>&1 && grep -lq '"narracao"' posts/fila/*.json; then
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
            python scripts/preparar_midia.py
            git add -A posts
            if ! git diff --cached --quiet; then
              git commit -m "Reels com narração"
              git push
              sleep 8  # dá tempo do raw.githubusercontent enxergar o arquivo novo
            fi
          fi

      - name: Publicar fila
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publicar.py

      - name: Registrar publicados
        if: always()
        run: |
          git add -A posts
          git diff --cached --quiet || git commit -m "Publicados no Instagram"
          git pull --rebase -q || true
          git push
