name: Publicar no Instagram

on:
  push:
    branches: [main]
    paths: ["posts/fila/**", "scripts/publicar.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar fila
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publicar.py

      - name: Registrar publicados
        if: always()
        run: |
          git config user.name "congoapp-bot"
          git config user.email "congoapp-bot@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet || git commit -m "Publicados no Instagram"
          git push
